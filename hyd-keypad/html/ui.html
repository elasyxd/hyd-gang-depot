<head>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="debounce.min.js" type="text/javascript"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
	<link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
	<link rel="stylesheet" href="styles.css" type="text/css">
	<style>
		html,
		body {
			background: transparent !important;
			background-color: rgba(0, 0, 0, 0) !important;
		}

		#wrap {
			width: 100vw;
			height: 100vh;
			display: none;
			justify-content: center;
			align-items: center;
			background: transparent !important;
			position: fixed;
			top: 0;
			left: 0;
		}
	</style>
</head>

<body>
	<div id="wrap">
		<div id="PINcontainer">
			<div class="header">
				<div class="title-container">
					<h1 class="main-title">ERİŞİM KONTROLÜ</h1>
					<p class="sub-title">Depoya erişmek için PIN kodunuzu girin</p>
				</div>
				<button class="close-btn" onclick="closeGui()">✕</button>
			</div>

			<div class="pin-display-section">
				<div class="pin-slots">
					<div class="pin-slot active" data-index="0"></div>
					<div class="pin-slot" data-index="1"></div>
					<div class="pin-slot" data-index="2"></div>
					<div class="pin-slot" data-index="3"></div>
					<div class="pin-slot" data-index="4"></div>
					<div class="pin-slot" data-index="5"></div>
				</div>
				<p class="hint-text">6 HANELİ KODU GİRİN</p>
			</div>

			<div class="keypad-grid">
				<button class="key-btn" onclick="inputNumber(1)">1</button>
				<button class="key-btn" onclick="inputNumber(2)">2</button>
				<button class="key-btn" onclick="inputNumber(3)">3</button>
				<button class="key-btn" onclick="inputNumber(4)">4</button>
				<button class="key-btn" onclick="inputNumber(5)">5</button>
				<button class="key-btn" onclick="inputNumber(6)">6</button>
				<button class="key-btn" onclick="inputNumber(7)">7</button>
				<button class="key-btn" onclick="inputNumber(8)">8</button>
				<button class="key-btn" onclick="inputNumber(9)">9</button>
				<button class="key-btn" onclick="deleteLast()">SİL</button>
				<button class="key-btn zero-btn" onclick="inputNumber(0)"><span>0</span></button>
				<button class="key-btn" onclick="clearPin()">X</button>
			</div>

			<button class="confirm-btn" onclick="confirmPin()">ONAYLA</button>
		</div>
	</div>
	<script src="scripts.js" type="text/javascript"></script>
</body>
